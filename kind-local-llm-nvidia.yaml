# kind cluster for NVIDIA GPUs. BEST EFFORT, NOT TESTED ON REAL HARDWARE.
# Prefer `nvkind cluster create` (github.com/NVIDIA/nvkind), which does this
# plus installs the container toolkit inside the node for you. This is the
# plain-kind equivalent from the nvkind docs: with
# accept-nvidia-visible-devices-as-volume-mounts=true set on the host, mounting
# /dev/null at this path asks the NVIDIA runtime to inject every GPU.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-llm
nodes:
  - role: control-plane
    # newest kind node image as of Nov 2026 (kind v0.33.0). Upstream is at 1.37.2.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraMounts:
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
