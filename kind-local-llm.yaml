# kind cluster for the Intel GPU path. The extraMounts line passes the GPU's
# render device (/dev/dri) into the node for the Intel GPU device plugin.
# On the CPU path, use kind-local-llm-cpu.yaml instead.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-llm
nodes:
  - role: control-plane
    # newest kind node image as of Nov 2026 (kind v0.33.0)
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraMounts:
      - hostPath: /dev/dri
        containerPath: /dev/dri
