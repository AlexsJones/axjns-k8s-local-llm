# Ollama on an NVIDIA GPU (CUDA, nvidia.com/gpu from NVIDIA's device plugin). The model is pulled once by an init container into a
# PersistentVolumeClaim, so restarts don't re-download 2GB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: llm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO volume, so don't run two at once
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia   # nvkind registers this RuntimeClass (so does the GPU Operator)
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.40.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve >/tmp/serve.log 2>&1 &
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "ollama serve didn't start:"; cat /tmp/serve.log; exit 1; }
                sleep 1
              done
              ollama pull "$MODEL"
          env:
            - name: MODEL
              value: llama3.2:3b
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:0.40.13
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"          # keep the model in memory between requests
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"         # fixed context, so the KV cache stays small
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1   # extended resources only need a limit; the request is set to match
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 80
      targetPort: http
