# A pod that expects a Hugging Face token secret nobody created.
# The usual mistake with gated models.
apiVersion: v1
kind: Pod
metadata:
  name: model-downloader
  namespace: llm
spec:
  restartPolicy: Never
  containers:
    - name: download
      image: ollama/ollama:0.40.13
      command: ["sh", "-c", "echo would download with $HF_TOKEN"]
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
