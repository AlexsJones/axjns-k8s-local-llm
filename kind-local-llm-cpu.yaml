# kind cluster for the CPU-only path. No device mounts: the CPU path doesn't
# need any, and a hostPath that doesn't exist on your machine (no /dev/dri)
# would make Docker create an empty directory there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-llm
nodes:
  - role: control-plane
    # newest kind node image as of Nov 2026 (kind v0.33.0)
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
