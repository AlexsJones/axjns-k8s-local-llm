# kind cluster for AMD GPUs (ROCm). The node needs both the DRM render
# nodes and the ROCm compute interface (/dev/kfd).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-llm
nodes:
  - role: control-plane
    # newest kind node image as of Nov 2026 (kind v0.33.0)
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraMounts:
      - hostPath: /dev/dri
        containerPath: /dev/dri
      - hostPath: /dev/kfd
        containerPath: /dev/kfd
